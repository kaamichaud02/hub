name: Build and push hub Docker image

on:
  push:
    branches: [ master, main, dev ]
    paths:
      - 'hub-app/**'
      - '.github/workflows/hub-docker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag from branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./hub-app
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/kaamichaud02/hub:${{ steps.vars.outputs.tag }}
            ghcr.io/kaamichaud02/hub:${{ github.sha }}
