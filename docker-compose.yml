version: "3.8"

services:
  hub:
    build: ./hub-app
    image: ghcr.io/kaamichaud02/hub:dev
    container_name: hub-kaa-zone
    restart: unless-stopped
    environment:
      - HUB_DB_HOST=${HUB_DB_HOST}
      - HUB_DB_PORT=${HUB_DB_PORT:-5432}
      - HUB_DB_NAME=${HUB_DB_NAME:-hub_kaa_zone}
      - HUB_DB_USER=${HUB_DB_USER}
      - HUB_DB_PASSWORD=${HUB_DB_PASSWORD}
    ports:
      - "8420:8000"

  suivi_temps:
    # Image construite par .github/workflows/suivi_temps-docker.yml (CI),
    # pas de build local ici — même pratique qu'avant la fusion dans le monorepo.
    image: ghcr.io/kaamichaud02/hub:suivi_temps-dev
    container_name: suivi-temps
    restart: unless-stopped
    environment:
      - SECRET_KEY=${ST_SECRET_KEY}
      - DATABASE_ENGINE=${ST_DATABASE_ENGINE:-django.db.backends.postgresql}
      - DATABASE_NAME=${ST_DATABASE_NAME}
      - DATABASE_USER=${ST_DATABASE_USER}
      - DATABASE_PASSWORD=${ST_DATABASE_PASSWORD}
      - DATABASE_HOST=${ST_DATABASE_HOST}
      - DATABASE_PORT=${ST_DATABASE_PORT:-5432}
      - TELEGRAM_BOT_TOKEN=${ST_TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${ST_TELEGRAM_CHAT_ID}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_AUD=${ST_CF_ACCESS_AUD}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8421:8000"
