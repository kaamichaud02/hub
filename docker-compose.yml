version: "3.8"

services:
  hub:
    build: ./hub-app
    image: ghcr.io/kaamichaud02/hub:dev
    container_name: hub-kaa-zone
    restart: unless-stopped
    environment:
      - HUB_DB_HOST=${HUB_DB_HOST}
      - HUB_DB_PORT=${HUB_DB_PORT:-5432}
      - HUB_DB_NAME=${HUB_DB_NAME:-hub_kaa_zone}
      - HUB_DB_USER=${HUB_DB_USER}
      - HUB_DB_PASSWORD=${HUB_DB_PASSWORD}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD}
      - ST_DATABASE_HOST=${ST_DATABASE_HOST}
      - ST_DATABASE_PORT=${ST_DATABASE_PORT:-5432}
      - ST_DATABASE_NAME=${ST_DATABASE_NAME}
      - ST_DATABASE_USER=${ST_DATABASE_USER}
      - ST_DATABASE_PASSWORD=${ST_DATABASE_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    ports:
      - "8420:8000"
