<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub · kaa.zone</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Hub</h1>
        <span id="appVersion" class="app-version"></span>
      </div>
      <nav id="sectionList" class="section-list">
        <div class="section-item active" data-section="kanban">
          <span class="item-icon">🗂️</span>
          <span class="item-name">Kanban</span>
        </div>
        <div class="section-item" data-section="suivi_temps">
          <span class="item-icon">🕒</span>
          <span class="item-name">Suivi de temps</span>
        </div>
      </nav>
      <div id="sidebarFooter" class="sidebar-footer">
        <span id="sidebarFooterText"></span>
        <button id="sidebarSettingsBtn" class="icon-btn" title="Modifier mon nom" hidden>⚙️</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div id="boardTabs" class="board-tabs"></div>
        <h2 id="pageTitle" class="section-title" hidden>Suivi de temps</h2>
      </header>
      <main id="boardView" class="board-columns"></main>
      <div id="suiviTempsPlaceholder" class="tab-placeholder" hidden></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="/static/js/timesheets.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
